*, *::before, *::after{ box-sizing:border-box; }
html{ background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%; }
body{ margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px; font:400 17px/1.6 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
html.cur-on{ cursor:var(--cur-d); } html.cur-on a{ cursor:var(--cur-p); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }
.env-paint{ position:fixed; inset:0; z-index:-4; pointer-events:none; transition:opacity 1.4s ease; background:linear-gradient(180deg, var(--p1), var(--p2) 62%, var(--p3)); }
.env-paint svg{ position:absolute; left:0; bottom:0; width:100%; height:78%; display:none; }
html[data-time="night"] .env-paint .pt-night, html[data-time="morning"] .env-paint .pt-morning, html[data-time="dusk"] .env-paint .pt-dusk{ display:block; }
.env-paint .l1{ fill:var(--pfar); transform:translateY(calc(var(--sp,0) * -30px)); }
.env-paint .l2{ fill:var(--pmid); transform:translateY(calc(var(--sp,0) * -70px)); }
.env-paint .l3{ fill:var(--pnear); transform:translateY(calc(var(--sp,0) * -120px)); }
.env-paint .sn{ fill:var(--psnow); opacity:.9; transform:translateY(calc(var(--sp,0) * -30px)); }
.env-paint .mo{ fill:#F4F1E6; filter:drop-shadow(0 0 30px rgba(200,215,255,.55)); transform:translateY(calc(var(--sp,0) * 60px)); }
.env-paint .su{ fill:#FFB070; filter:drop-shadow(0 0 60px rgba(255,150,90,.8)); transform:translateY(calc(var(--sp,0) * 90px)); }
.lost{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:visible; }
.lost .lt{ fill:none; stroke:var(--ink); stroke-opacity:.3; stroke-width:1.6; stroke-linecap:round; stroke-dasharray:1 9; }
.lost .fp use{ fill:var(--accent); fill-opacity:.8; }
.lost.found .fp use{ fill-opacity:1; }
.box{ position:relative; z-index:1; width:min(640px, 100%); padding:clamp(28px, 5vw, 48px); border-radius:26px; border:1px solid var(--line); background:rgba(var(--veil), .74); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); box-shadow:0 40px 90px -40px rgba(0,0,0,.6); }
.k{ margin:0; font:500 13px var(--mono); color:var(--accent); letter-spacing:.02em; }
h1{ margin:12px 0 0; font:500 clamp(34px, 6vw, 58px)/1.04 var(--serif); letter-spacing:-.02em; }
.d{ margin:18px 0 0; max-width:46ch; color:var(--muted); font-size:18px; }
.bug{ margin:16px 0 0; font:500 12.5px/1.5 var(--mono); color:var(--faint); overflow-wrap:anywhere; }
.bug b{ font-weight:500; color:var(--ink); }
.go{ display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
.btn{ display:inline-flex; align-items:center; gap:9px; height:48px; padding:0 20px; border-radius:99px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:500 15px var(--sans); text-decoration:none; transition:transform .25s var(--e), border-color .2s ease, background .2s ease; }
.btn:hover{ transform:translateY(-2px); border-color:var(--accent); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--on); }
.btn svg{ width:18px; height:18px; }
.egg{ margin:22px 0 0; font:500 12px var(--mono); color:var(--accent); opacity:0; transition:opacity .6s ease 1.6s; }
.egg.on{ opacity:1; }
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{ transition:none !important; animation:none !important; } }

<script>
(function(){
  'use strict';
  var root = document.documentElement, NS = 'http://www.w3.org/2000/svg', reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* the site lives at /Aravind_Natarajan/ on GitHub Pages; anywhere else (a local server), home is / */
  var base = location.pathname.indexOf('/Aravind_Natarajan/') === 0 || location.pathname === '/Aravind_Natarajan' ? '/Aravind_Natarajan/' : '/';
  document.getElementById('home').href = base; document.getElementById('summit').href = base + '#summit'; document.getElementById('hello').href = base + '#contact';
  var p = location.pathname; try { p = decodeURIComponent(p); } catch (e){}
  document.getElementById('where').textContent = p.length > 64 ? p.slice(0, 61) + '…' : p;
  /* getting lost is one of the site's five secrets */
  try { var IDS = ['summit', 'konami', 'wink', 'bird', 'lost'], f = JSON.parse(localStorage.getItem('av-eggs') || '{}') || {}, fresh = !f.lost;
    if (fresh){ f.lost = Date.now(); localStorage.setItem('av-eggs', JSON.stringify(f)); }
    var n = IDS.filter(function(k){ return f[k]; }).length, eg = document.getElementById('egg');
    eg.textContent = 'Secret ' + n + ' of 5 ' + (fresh ? 'found' : 'found before') + '. Getting lost counts.'; requestAnimationFrame(function(){ eg.classList.add('on'); }); } catch (e){}

  /* the footprints wander in circles; point at "Back to the trail" and they straighten out and lead to it */
  var svg = document.querySelector('.lost'), line = svg.querySelector('.lt'), fp = svg.querySelector('.fp'), btn = document.getElementById('home');
  var N = 70, W = 0, H = 0, LOST = [], FOUND = [], k = 0, v = 0, goal = 0, drawn = reduce ? 1 : 0, raf = 0, prints = [], t0 = 0;
  function seed(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return function(){ h = h + 0x6D2B79F5 | 0; var t = Math.imul(h ^ h >>> 15, 1 | h); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function build(){
    W = window.innerWidth; H = window.innerHeight; var R = seed(location.pathname + W), x = -30, y = H * 0.84, a = -0.35, turn = 0, i;
    LOST = [];
    for (i = 0; i < N; i++){ LOST.push([x, y]);
      if (i % 11 === 3) turn = (R() < 0.5 ? -1 : 1) * (0.28 + R() * 0.18); else if (i % 11 === 9) turn = 0;
      a += turn + (R() - 0.5) * 0.35;
      var m = 70; if (x < m || x > W - m || y < m || y > H - m){ var ta = Math.atan2(H * 0.5 - y, W * 0.5 - x), d = ta - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; a += d * 0.35; }
      x += Math.cos(a) * 26; y += Math.sin(a) * 26; }
    var r = btn.getBoundingClientRect(), bx = r.left + r.width * 0.5, by = r.top + r.height + 14;
    FOUND = [];
    for (i = 0; i < N; i++){ var u = i / (N - 1), e = 1 - Math.pow(1 - u, 1.6), m2 = 1 - u;
      FOUND.push([m2 * m2 * -30 + 2 * m2 * u * (W * 0.12) + u * u * bx + Math.sin(u * 9) * 4 * (1 - u), m2 * m2 * (H * 0.84) + 2 * m2 * u * (H * 1.02) + u * u * by]); }
  }
  function pt(i){ var a = LOST[i], b = FOUND[i]; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
  function render(){
    var n = Math.max(2, Math.round(drawn * N)), P = [], i;
    for (i = 0; i < n; i++) P.push(pt(i));
    var d = 'M' + P[0][0].toFixed(1) + ' ' + P[0][1].toFixed(1);
    for (i = 0; i < P.length - 1; i++){ var p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1); }
    line.setAttribute('d', d);
    /* a print every 22px, alternating feet */
    var L = 0, next = 10, side = 1, used = 0;
    for (i = 0; i < P.length - 1; i++){ var ax = P[i][0], ay = P[i][1], dx = P[i + 1][0] - ax, dy = P[i + 1][1] - ay, sl = Math.hypot(dx, dy) || 1;
      while (next <= L + sl){ var f = (next - L) / sl, an = Math.atan2(dy, dx), px = ax + dx * f - Math.sin(an) * 5 * side, py = ay + dy * f + Math.cos(an) * 5 * side, u = prints[used];
        if (!u){ u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#boot'); fp.appendChild(u); prints.push(u); }
        u.setAttribute('transform', 'translate(' + px.toFixed(1) + ' ' + py.toFixed(1) + ') rotate(' + (an * 180 / Math.PI + 90).toFixed(1) + ') scale(' + (side > 0 ? 1 : -1) + ' 1)');
        u.style.display = ''; used++; side = -side; next += 22; }
      L += sl; }
    for (i = used; i < prints.length; i++) prints[i].style.display = 'none';
    svg.classList.toggle('found', k > 0.9);
  }
  function tick(now){
    raf = 0; if (!t0) t0 = now;
    if (drawn < 1) drawn = Math.min(1, (now - t0) / 2600);
    if (reduce){ k = goal; v = 0; } else { v += ((goal - k) * 90 - v * 13) * 0.016; k += v * 0.016; }
    render();
    if (drawn < 1 || Math.abs(goal - k) > 0.002 || Math.abs(v) > 0.002) raf = requestAnimationFrame(tick); else { k = goal; render(); }
  }
  function wake(){ if (!raf) raf = requestAnimationFrame(tick); }
  function set(g){ goal = g; wake(); }
  btn.addEventListener('pointerenter', function(){ set(1); }); btn.addEventListener('pointerleave', function(){ set(0); });
  btn.addEventListener('focus', function(){ set(1); }); btn.addEventListener('blur', function(){ set(0); });
  /* no hover on touch screens: after a moment the trail finds its own way back */
  if (!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) || 'ontouchstart' in window) setTimeout(function(){ set(1); }, reduce ? 0 : 4200);
  var rz = 0; window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(function(){ build(); render(); }, 120); });
  function start(){ build(); wake(); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start, start); else start();
})();
